<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bot Control</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111827; color: #f9fafb; }
      body { max-width: 760px; margin: 0 auto; padding: 32px 20px; }
      h1 { margin-bottom: 6px; } p { color: #9ca3af; }
      section { background: #1f2937; border: 1px solid #374151; border-radius: 10px; padding: 20px; margin-top: 20px; }
      label { display: block; margin: 14px 0 6px; color: #d1d5db; }
      input, textarea { box-sizing: border-box; width: 100%; border: 1px solid #4b5563; border-radius: 6px; padding: 10px; color: inherit; background: #111827; }
      textarea { min-height: 110px; resize: vertical; }
      .bots { display: flex; flex-wrap: wrap; gap: 10px; }
      .bots label { margin: 0; background: #111827; padding: 10px; border-radius: 6px; }
      button { margin-top: 16px; border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; background: #22c55e; color: #052e16; font-weight: 700; }
      #status { white-space: pre-wrap; color: #a7f3d0; }
    </style>
  </head>
  <body>
    <h1>Bot Control</h1>
    <p>Official Discord application bots only. Tokens stay on the server.</p>
    <section>
      <strong>Online bots</strong>
      <p id="online">Loading...</p>
    </section>
    <section>
      <strong>Voice channel connection</strong>
      <p>Each bot can join a different server and voice channel. The bot must be invited to that server with Connect permission.</p>
      <label for="voiceBot">Bot</label>
      <select id="voiceBot"><option value="1">Bot 1</option><option value="2">Bot 2</option><option value="3">Bot 3</option><option value="4">Bot 4</option><option value="5">Bot 5</option></select>
      <label for="guildId">Server ID</label>
      <input id="guildId" inputmode="numeric" placeholder="123456789012345678">
      <label for="voiceChannelId">Voice channel ID</label>
      <input id="voiceChannelId" inputmode="numeric" placeholder="123456789012345678">
      <button id="connectVoice">Join voice channel</button>
      <p id="voiceStatus"></p>
    </section>
    <section>
      <label for="adminToken">Web admin token</label>
      <input id="adminToken" type="password" autocomplete="off">
      <label>Bots to use</label>
      <div class="bots">
        <label><input type="checkbox" value="1" checked> Bot 1</label>
        <label><input type="checkbox" value="2" checked> Bot 2</label>
        <label><input type="checkbox" value="3" checked> Bot 3</label>
        <label><input type="checkbox" value="4" checked> Bot 4</label>
        <label><input type="checkbox" value="5" checked> Bot 5</label>
      </div>
      <label for="channelId">Discord channel ID</label>
      <input id="channelId" inputmode="numeric" placeholder="123456789012345678">
      <label for="content">Message</label>
      <textarea id="content" maxlength="2000" placeholder="Maintenance message"></textarea>
      <button id="send">Send message</button>
      <p id="status"></p>
    </section>
    <script>
      async function refresh() {
        const response = await fetch('/api/bots');
        const bots = await response.json();
        document.querySelector('#online').textContent = bots.filter((bot) => bot.online).map((bot) => `Bot ${bot.number}: ${bot.tag}${bot.voiceConnected ? ` | voice: ${bot.voiceChannelId}` : ''}`).join('\n') || 'No bots online';
      }
      document.querySelector('#connectVoice').addEventListener('click', async () => {
        const response = await fetch('/api/voice/connect', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${document.querySelector('#adminToken').value}` }, body: JSON.stringify({ botNumber: Number(document.querySelector('#voiceBot').value), guildId: document.querySelector('#guildId').value, voiceChannelId: document.querySelector('#voiceChannelId').value }) });
        document.querySelector('#voiceStatus').textContent = JSON.stringify(await response.json(), null, 2);
        refresh();
      });
      document.querySelector('#send').addEventListener('click', async () => {
        const botNumbers = [...document.querySelectorAll('.bots input:checked')].map((input) => Number(input.value));
        const response = await fetch('/api/broadcast', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${document.querySelector('#adminToken').value}` }, body: JSON.stringify({ botNumbers, channelId: document.querySelector('#channelId').value, content: document.querySelector('#content').value }) });
        document.querySelector('#status').textContent = JSON.stringify(await response.json(), null, 2);
      });
      refresh();
      setInterval(refresh, 10000);
    </script>
  </body>
</html>
